name: Release Android
on:
  push:
    tags: ['v*']
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # GitHub Variables (Settings > Secrets and variables > Actions > Variables). Publicas; NAO sao secrets.
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      PUBLIC_WHATSAPP_NUMBER: ${{ vars.PUBLIC_WHATSAPP_NUMBER }}
    steps:
      - uses: actions/checkout@v4
      - name: Confere variaveis publicas do app (falha cedo; nunca imprime valores)
        run: |
          missing=""
          for n in PUBLIC_FIREBASE_API_KEY PUBLIC_FIREBASE_AUTH_DOMAIN PUBLIC_FIREBASE_PROJECT_ID PUBLIC_FIREBASE_APP_ID PUBLIC_API_BASE_URL PUBLIC_WHATSAPP_NUMBER; do
            v="$(printenv "$n" | tr -d '[:space:]' || true)"
            [ -n "$v" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Variables vazias ou ausentes:$missing. Cadastre em Settings > Secrets and variables > Actions > Variables (veja docs/SETUP.md)."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: bun install --frozen-lockfile
      - run: bun run cap:sync
      - name: Versao a partir da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      - name: Build AAB assinado
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.ANDROID_KEY_PASSWORD }}'
      - name: Enviar ao Google Play (faixa interna)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.jolog.agendamento
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
