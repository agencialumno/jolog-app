name: Release
# iOS (TestFlight) e Android (APK + AAB como artifacts, sem Google Play) em jobs paralelos e independentes, com a MESMA versao e build number.
# Gatilhos: tag v* e disparo manual. Nunca pull_request (repositorio publico: PRs de fork nao podem ver secrets).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Nao sao segredos.
  TEAM_ID: KH97Q8M556
  BUNDLE_ID: br.com.jolog.agendamento
  SCHEME: App

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Versao (tag sem "v"; no disparo manual, a do package.json) e build number
        id: v
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::versao invalida (esperado X.Y.Z)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Versao $VERSION (build $BUILD_NUMBER)"

  ios:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # GitHub Variables (Settings > Secrets and variables > Actions > Variables). Publicas; NAO sao secrets.
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      PUBLIC_WHATSAPP_NUMBER: ${{ vars.PUBLIC_WHATSAPP_NUMBER }}
      MARKETING: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Confere variaveis publicas do app (falha cedo; nunca imprime valores)
        run: |
          missing=""
          for n in PUBLIC_FIREBASE_API_KEY PUBLIC_FIREBASE_AUTH_DOMAIN PUBLIC_FIREBASE_PROJECT_ID PUBLIC_FIREBASE_APP_ID PUBLIC_API_BASE_URL PUBLIC_WHATSAPP_NUMBER; do
            v="$(printenv "$n" | tr -d '[:space:]' || true)"
            [ -n "$v" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Variables vazias ou ausentes:$missing. Cadastre em Settings > Secrets and variables > Actions > Variables (veja docs/SETUP.md)."
            exit 1
          fi
      - name: Confere secrets do iOS (falha cedo; so os nomes)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            v="$(printenv "$n" | tr -d '[:space:]' || true)"
            [ -n "$v" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes ou vazios (iOS):$missing. Veja docs/SETUP.md."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - run: bun run build:mobile
      - run: bunx cap sync ios

      - name: Grava a chave .p8 (somente neste job)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -eu
          echo "::add-mask::$ASC_KEY_ID"
          echo "::add-mask::$ASC_ISSUER_ID"
          echo "::add-mask::$ASC_KEY_P8_BASE64"
          umask 077
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          head -c 10 "$KEY" | grep -q -- '-----BEGIN' || { echo "::error::ASC_KEY_P8_BASE64 nao parece um .p8 em base64"; exit 1; }
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Confere projeto e bundle id
        working-directory: ios/App
        run: |
          set -eu
          # Capacitor com SPM: so App.xcodeproj. Com CocoaPods: App.xcworkspace.
          if [ -d App.xcworkspace ]; then echo "BUILD_FLAG=-workspace App.xcworkspace" >> "$GITHUB_ENV"
          else echo "BUILD_FLAG=-project App.xcodeproj" >> "$GITHUB_ENV"; fi
          [ -d App.xcworkspace ] && FLAG="-workspace App.xcworkspace" || FLAG="-project App.xcodeproj"
          FOUND="$(xcodebuild $FLAG -scheme "$SCHEME" -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/^ *PRODUCT_BUNDLE_IDENTIFIER =/{print $2; exit}')"
          [ "$FOUND" = "$BUNDLE_ID" ] || { echo "::error::bundle id inesperado: $FOUND"; exit 1; }

      - name: Archive (assinatura automatica)
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          # shellcheck disable=SC2086
          xcodebuild archive $BUILD_FLAG \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Exporta e envia ao TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Apaga a chave e temporarios
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/exportOptions.plist"
          rm -rf "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/export"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # GitHub Variables (Settings > Secrets and variables > Actions > Variables). Publicas; NAO sao secrets.
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
      PUBLIC_WHATSAPP_NUMBER: ${{ vars.PUBLIC_WHATSAPP_NUMBER }}
      VERSION_NAME: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Confere variaveis publicas do app (falha cedo; nunca imprime valores)
        run: |
          missing=""
          for n in PUBLIC_FIREBASE_API_KEY PUBLIC_FIREBASE_AUTH_DOMAIN PUBLIC_FIREBASE_PROJECT_ID PUBLIC_FIREBASE_APP_ID PUBLIC_API_BASE_URL PUBLIC_WHATSAPP_NUMBER; do
            v="$(printenv "$n" | tr -d '[:space:]' || true)"
            [ -n "$v" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Variables vazias ou ausentes:$missing. Cadastre em Settings > Secrets and variables > Actions > Variables (veja docs/SETUP.md)."
            exit 1
          fi
      - name: Confere secrets do Android (falha cedo; so os nomes)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for n in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            v="$(printenv "$n" | tr -d '[:space:]' || true)"
            [ -n "$v" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes ou vazios (Android):$missing. Veja docs/SETUP.md."
            exit 1
          fi
      - name: Confere projeto nativo
        run: |
          [ -f android/app/build.gradle ] || { echo "::error::pasta android/ ausente. Rode 'bunx cap add android' na sua maquina e faca commit (veja docs/SETUP.md)."; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: bun install --frozen-lockfile
      - run: bun run build:mobile
      - run: bunx cap sync android

      - name: Versao (mesma do iOS)
        run: |
          set -eu
          F=android/app/build.gradle
          sed -i -E "s/versionName \".*\"/versionName \"$VERSION_NAME\"/; s/versionCode [0-9]+/versionCode $VERSION_CODE/" "$F"
          grep -q "versionName \"$VERSION_NAME\"" "$F" && grep -q "versionCode $VERSION_CODE" "$F" \
            || { echo "::error::nao consegui definir versionName/versionCode em $F (formato inesperado)"; exit 1; }

      - name: Grava a keystore (somente neste job)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          echo "::add-mask::$ANDROID_KEYSTORE_BASE64"
          umask 077
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build APK e AAB assinados (keystore de release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      # FUTURO - Google Play: depois do primeiro upload manual e de criar a conta de servico, entra aqui
      # um passo com r0adkll/upload-google-play@v1 (serviceAccountJsonPlainText vindo do secret
      # GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, packageName br.com.jolog.agendamento, track internal,
      # releaseFiles android/app/build/outputs/bundle/release/app-release.aab). Hoje NADA e enviado a Play.

      - name: Artifact - APK (instalar direto no celular)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Artifact - AAB (primeiro upload manual na Play)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Apaga a keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
